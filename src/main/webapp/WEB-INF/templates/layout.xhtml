<?xml version="1.0" encoding="UTF-8"?>
<!--
  Shared page frame: header, navigation, message area and footer.

  Every screen inserts itself into the "content" placeholder below, so the
  chrome exists once. The navigation renders conditionally on the session bean,
  but that is presentation only - AuthFilter is what actually enforces access.
-->
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      lang="en" dir="ltr">

<!--
  h:head and h:body are the JSF versions of the plain HTML tags. They look the
  same in the output, but they give the framework somewhere to add what it
  needs: h:head is where stylesheets registered by h:outputStylesheet are
  written out, and h:body is where JSF places the resources a component asks
  for. Using plain head and body would silently drop them.
-->
<h:head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <!--
      ui:insert marks a hole that each page fills with a matching ui:define.
      The text inside it is the default used by any page that does not.
    -->
    <title><ui:insert name="title">Sartia</ui:insert> · Sartia</title>

    <!--
      Referenced by library and name rather than by path. JSF resolves it to
      /resources/css/sartia.css and appends a version marker, so a browser
      picks up a changed stylesheet instead of serving a cached copy.
    -->
    <h:outputStylesheet library="css" name="sartia.css"/>
</h:head>

<h:body>

    <header class="site-header">
        <div class="header-inner">
            <h:link outcome="/catalog.xhtml" styleClass="brand">
                Sartia<span>Movie Rentals</span>
            </h:link>

            <!--
              The rendered attribute decides whether a component is written to
              the page at all, so a signed out visitor receives no markup for
              these links rather than hidden markup.

              This is convenience, not security. A visitor who types the
              address of a link they cannot see still reaches the server, and
              AuthFilter is what turns them away. The navigation reflects the
              rule; it does not enforce it.
            -->
            <nav class="main-nav">
                <h:link outcome="/catalog.xhtml" value="Catalogue"/>

                <h:link outcome="/my-rentals.xhtml" value="My Rentals"
                        rendered="#{userSession.loggedIn}"/>

                <h:link outcome="/admin/movies.xhtml" value="Manage Catalogue"
                        rendered="#{userSession.admin}"/>

                <h:link outcome="/admin/returns.xhtml" value="Open Rentals"
                        rendered="#{userSession.admin}"/>
            </nav>

            <div class="user-area">
                <ui:fragment rendered="#{userSession.loggedIn}">
                    <span class="who">Hello, #{userSession.displayName}</span>
                    <!--
                      Sign out is a button inside a form, not a link, because it
                      changes something on the server. A browser or a proxy may
                      fetch a link on its own to preheat it, which with a link
                      would sign the user out behind their back.
                    -->
                    <h:form>
                        <h:commandButton value="Sign out" action="#{userSession.logout}"
                                         styleClass="btn btn-secondary btn-sm"/>
                    </h:form>
                </ui:fragment>

                <ui:fragment rendered="#{not userSession.loggedIn}">
                    <h:link outcome="/login.xhtml" value="Sign in" styleClass="btn btn-secondary btn-sm"/>
                    <h:link outcome="/register.xhtml" value="Register" styleClass="btn btn-sm"/>
                </ui:fragment>
            </div>
        </div>
    </header>

    <!--
      ui:insert name="content" further down is where each screen is placed.
      Everything around it, header and footer included, is written once here,
      so a change to the chrome reaches every page at once.
    -->
    <main class="page">
        <!-- globalOnly: messages attached to a specific input are rendered
             beside that input by the page itself, not repeated up here. -->
        <div class="messages">
            <h:messages globalOnly="true" layout="list"
                        infoClass="msg-info" errorClass="msg-error"
                        warnClass="msg-info" fatalClass="msg-error"/>
        </div>

        <ui:insert name="content"/>
    </main>

    <footer class="site-footer">
        Sartia · Final Project · The Open University
    </footer>

</h:body>
</html>
