<?xml version="1.0" encoding="UTF-8"?>
<!-- Customer self-registration. -->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                template="/WEB-INF/templates/layout.xhtml">

    <ui:define name="title">Register</ui:define>

    <ui:define name="content">

        <div class="narrow">
            <div class="panel">
                <h1 class="page-title" style="font-size:1.35rem;">Create an account</h1>
                <p class="page-subtitle">An account is required to rent films and write reviews</p>

                <h:form id="regForm">
                    <div class="field">
                        <label for="regForm:username">Username</label>
                        <h:inputText id="username" value="#{registerBean.username}" required="true"
                                     requiredMessage="Please enter a username"/>
                        <h:message for="username" styleClass="field-error"/>
                    </div>

                    <div class="field">
                        <label for="regForm:fullName">Full name</label>
                        <h:inputText id="fullName" value="#{registerBean.fullName}" required="true"
                                     requiredMessage="Please enter your full name"/>
                        <h:message for="fullName" styleClass="field-error"/>
                    </div>

                    <div class="field">
                        <label for="regForm:email">Email address</label>
                        <h:inputText id="email" value="#{registerBean.email}" required="true"
                                     requiredMessage="Please enter an email address"/>
                        <h:message for="email" styleClass="field-error"/>
                    </div>

                    <div class="field">
                        <label for="regForm:phone">Phone (optional)</label>
                        <h:inputText id="phone" value="#{registerBean.phone}"/>
                    </div>

                    <div class="form-row">
                        <div class="field">
                            <label for="regForm:password">Password</label>
                            <h:inputSecret id="password" value="#{registerBean.password}" required="true"
                                           requiredMessage="Please enter a password"/>
                            <h:message for="password" styleClass="field-error"/>
                        </div>

                        <div class="field">
                            <label for="regForm:passwordConfirm">Confirm password</label>
                            <h:inputSecret id="passwordConfirm" value="#{registerBean.passwordConfirm}"
                                           required="true" requiredMessage="Please confirm the password"/>
                            <h:message for="passwordConfirm" styleClass="field-error"/>
                        </div>
                    </div>

                    <p style="font-size:.82rem;color:#5b6472;margin:0;">
                        The password must be at least 8 characters long.
                    </p>

                    <div class="form-actions">
                        <h:commandButton value="Register" action="#{registerBean.register}" styleClass="btn"/>
                        <h:link outcome="/login.xhtml" value="Already registered? Sign in" styleClass="btn btn-secondary"/>
                    </div>
                </h:form>
            </div>
        </div>

    </ui:define>
</ui:composition>
