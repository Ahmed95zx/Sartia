# ---------------------------------------------------------------------
# Sartia - runtime configuration
#
# Every key here may be overridden at startup with a JVM system property
# of the same name, e.g.
#     java -Ddb.url=jdbc:mysql://otherhost:3306/sartia -jar payara-micro.jar ...
# so the same WAR can be deployed against a different database without
# being rebuilt.
# ---------------------------------------------------------------------

# serverTimezone      - pins the driver's timezone so DATE values do not shift.
# allowPublicKeyRetrieval + useSSL=false - acceptable for a local, loopback-only
#                       development database; a deployed instance would use TLS.
db.url=jdbc:mysql://127.0.0.1:3306/sartia?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Jerusalem&characterEncoding=UTF-8
db.user=root
db.password=ahmed1995

# Pool sizing. Kept small on purpose: a pool larger than the database can
# usefully serve only moves queuing from the application into MySQL.
db.pool.maxSize=10
db.pool.minIdle=2
db.pool.connectionTimeoutMs=5000

# ---------------------------------------------------------------------
# Business rules
# ---------------------------------------------------------------------
# Days a customer may keep a disc before it counts as overdue.
rental.periodDays=7

# How many titles one customer may hold at the same time.
rental.maxConcurrentPerUser=3

# Charged for each day a rental is past its due date, in shekels.
rental.lateFeePerDay=3.00
