# Overrides the framework's built-in conversion and validation messages so a
# user never sees an English default in an otherwise Hebrew interface.
#
# Written as literal UTF-8. Since Java 9 ResourceBundle reads .properties files
# as UTF-8, so the \uXXXX escaping older codebases needed here is unnecessary.

javax.faces.component.UIInput.REQUIRED=שדה זה הוא חובה
jakarta.faces.component.UIInput.REQUIRED=שדה זה הוא חובה
jakarta.faces.converter.IntegerConverter.INTEGER=יש להזין מספר שלם
jakarta.faces.converter.BigDecimalConverter.DECIMAL=יש להזין מספר
jakarta.faces.validator.LengthValidator.MAXIMUM=הטקסט ארוך מדי
jakarta.faces.validator.LongRangeValidator.NOT_IN_RANGE=הערך אינו בטווח החוקי
