# Overrides the framework's built-in conversion and validation messages so the
# wording matches the rest of the interface instead of the JSF defaults, which
# quote the internal component id back at the user.
#
# Written as literal UTF-8. Since Java 9 ResourceBundle reads .properties files
# as UTF-8, so the \uXXXX escaping older codebases needed here is unnecessary.

javax.faces.component.UIInput.REQUIRED=This field is required
jakarta.faces.component.UIInput.REQUIRED=This field is required
jakarta.faces.converter.IntegerConverter.INTEGER=Please enter a whole number
jakarta.faces.converter.BigDecimalConverter.DECIMAL=Please enter a number
jakarta.faces.validator.LengthValidator.MAXIMUM=That text is too long
jakarta.faces.validator.LongRangeValidator.NOT_IN_RANGE=That value is outside the allowed range
